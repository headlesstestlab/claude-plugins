# Generated by the demo gallery (scripts/skills-release.ts); do not edit.
# gitleaks: the default rules plus the skills' reviewed false positives.
[extend]
useDefault = true

[[allowlists]]
description = "Web form spec field keys"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''"(key|referenceKey)":''']

[[allowlists]]
description = "Docusign IDV workflow ids (public, same for every account)"
targetRules = ["generic-api-key"]
regexTarget = "line"
condition = "AND"
paths = ['''esign-template-spec\.mjs$''']
regexes = ['''^\s*'[^']+': '[0-9a-f-]{36}',''']
